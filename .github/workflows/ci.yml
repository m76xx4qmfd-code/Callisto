name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.1
          pip install -r requirements.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Guard against hardcoded fill-simulator constants
        working-directory: ${{ github.workspace }}
        run: python scripts/ci/check_no_hardcoded_fill_constants.py

  backend-test-shard:
    name: Backend Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 0
            label: 1/3
          - index: 1
            label: 2/3
          - index: 2
            label: 3/3
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homerun
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-timeout
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/homerun
        run: |
          python - <<'PY'
          from pathlib import Path

          import pytest

          test_files = sorted(str(path) for path in Path("tests").rglob("test_*.py"))
          selected_files = test_files[${{ matrix.index }}::3]
          raise SystemExit(pytest.main([*selected_files, "-v", "--tb=short", "--timeout=60"]))
          PY

  backend-test:
    name: Backend Tests
    needs: backend-test-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend shard
        env:
          SHARD_RESULT: ${{ needs.backend-test-shard.result }}
        run: test "$SHARD_RESULT" = "success"

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & portfolio regression tests
        run: |
          npx tsc --noEmit
          npm run test:kalshi-portfolio-wire
          npm run test:kalshi-portfolio-component
          npm run test:kalshi-paper-wire
          npm run test:kalshi-paper-component

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
